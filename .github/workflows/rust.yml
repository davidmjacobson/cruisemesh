name: Rust

# Before this workflow, nothing ran cargo test, clippy,
# fmt, or the Android unit tests on any PR/push -- a relayd-only PR (or a
# core change that broke a UniFFI-generated binding) triggered zero
# compile/test jobs. This closes that gap for the 330+ test Rust workspace
# and the Android JVM unit tests.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace
        # As of 2026-07-20 the workspace is NOT clippy-clean (pre-existing
        # warnings in core/src/{engine,gossip,identity,store,transport_policy}.rs
        # and relayd's tests/*.rs, none introduced by FR1). Non-blocking for
        # now so this workflow is useful immediately instead of red from
        # the first run; a follow-up PR should clear the backlog and drop
        # `continue-on-error`.
        continue-on-error: true
        run: cargo clippy --workspace --exclude cruisemesh-node --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --exclude cruisemesh-node

  windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            desktop/ui/src-tauri -> target
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/ui/package-lock.json
      - name: Test CruiseMesh Helper
        run: cargo test -p cruisemesh-node
      - name: Clippy CruiseMesh Helper
        # Core has a documented pre-existing clippy backlog in the Ubuntu job.
        # This gate is for warnings introduced by the Windows shell itself.
        run: cargo clippy -p cruisemesh-node --all-targets --no-deps -- -D warnings
      - name: Build messenger frontend
        working-directory: desktop/ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Lint Tauri messenger host
        run: cargo clippy --manifest-path desktop/ui/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build Tauri messenger
        working-directory: desktop/ui
        run: npm run tauri build -- --no-bundle
      - name: Build dogfood helper
        run: cargo build --release -p cruisemesh-node
      - name: Upload Windows dogfood
        uses: actions/upload-artifact@v4
        with:
          name: cruisemesh-windows-x64
          path: |
            target/release/cruisemesh-node.exe
            desktop/ui/src-tauri/target/release/CruiseMesh.exe
            desktop/DOGFOOD.md

  android-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # AGENTS.md "Android UniFFI Setup": fresh checkouts don't contain
      # kotlin-gen/ or jniLibs/ (both gitignored). JVM unit tests only need
      # the host cdylib + generated Kotlin bindings -- app/build.gradle.kts
      # points JNA straight at target/debug/libcruisemesh_core.so, so unlike
      # a real device/emulator build this does NOT need jniLibs/ or the
      # Android NDK / cargo-ndk (that fuller path is core/build-android.sh,
      # deliberately not used here).
      - name: Build host cruisemesh-core library
        run: cargo build -p cruisemesh-core --features cruisemesh-core/cli
      - name: Generate Kotlin UniFFI bindings
        run: |
          cargo run -p cruisemesh-core --bin uniffi-bindgen --features cruisemesh-core/cli -- \
            generate --library target/debug/libcruisemesh_core.so --language kotlin \
            --out-dir android/app/src/main/kotlin-gen
      # kotlin-gen is gitignored (never committed on current master), so
      # this is a no-op today -- but it's a live tripwire: several long-lived
      # branches once each carried their own committed, eventually-stale
      # generated bindings. If
      # kotlin-gen ever ends up committed again (accidental `git add -A`, or
      # merging an old branch without regenerating), a stale copy now shows
      # up as a red check here instead of a UniFFI ABI-mismatch crash on a
      # phone.
      - name: kotlin-gen drift check
        run: git diff --exit-code android/app/src/main/kotlin-gen
      # THE authoritative gate on the committed Swift bindings. It lives here,
      # not in ios.yml, because this job runs on every PR with no path filter
      # and needs no Xcode, no cross-compiles and no xcframework, so it fails
      # in minutes instead of tens of them. ios.yml carries a comment pointing
      # back here and no drift check of its own; do not add a second one.
      #
      # The Swift bindings, unlike kotlin-gen, ARE committed -- and nothing
      # compiled catches them going stale: UniFFI checks its per-function
      # checksums at *runtime*, so a mismatch is a fatalError the moment the
      # app launches, while the iOS workflow only builds, and it regenerates
      # the bindings before it does. Since UniFFI 0.28.3 a function's doc
      # comment feeds its checksum, so even a comment-only edit in core/ can
      # silently invalidate a checked-in binding. Regenerate and diff, exactly
      # like the tripwire above. Blocking, with no continue-on-error: a
      # non-blocking drift check is an unread log line.
      #
      # --no-format is load-bearing for a gate that compares Linux output
      # against bytes a contributor may have generated on a Mac: uniffi-bindgen
      # silently pipes its Swift through swiftformat whenever that binary is on
      # PATH (`brew install swiftformat` puts it there; this runner has none).
      # swiftformat rewraps and reorders, so the difference is NOT whitespace
      # and --ignore-all-space below would not absorb it -- the gate would fail
      # a regeneration that is in fact perfectly current. core/build-ios.sh
      # passes the same flag so every generation path emits the same bytes.
      - name: Generate Swift UniFFI bindings
        run: |
          cargo run -p cruisemesh-core --bin uniffi-bindgen --features cruisemesh-core/cli -- \
            generate --no-format --library target/debug/libcruisemesh_core.so --language swift \
            --out-dir ios/CruiseMesh/Generated
      # --ignore-all-space on purpose: the committed copies are the generator's
      # output with trailing whitespace stripped (what every editor in the
      # project does on save). Signature and checksum drift -- the thing that
      # actually crashes the app -- is not whitespace, so it still fails here.
      - name: Swift bindings drift check (authoritative)
        run: git diff --exit-code --ignore-all-space ios/CruiseMesh/Generated
      - name: gradlew :app:testDebugUnitTest
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --rerun-tasks
      - name: Validate critical-screen screenshots
        working-directory: android
        run: ./gradlew :app:validateDebugScreenshotTest
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-differences
          path: android/app/build/reports/screenshotTest/
          if-no-files-found: ignore
      - name: gradlew :app:lintRelease
        working-directory: android
        run: ./gradlew :app:lintRelease
