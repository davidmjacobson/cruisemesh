name: Android UI device

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 7 * * *"

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # API 36 is the PR gate. The minimum supported API also runs nightly
        # without doubling every contributor's emulator minutes.
        device: ${{ fromJSON(github.event_name == 'schedule' && '["pixel6Api36", "pixel2Api31"]' || '["pixel6Api36"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Android native libraries and bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: bash core/build-android.sh
      - name: Run ${{ matrix.device }} UI tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:${{ matrix.device }}DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-${{ matrix.device }}
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
