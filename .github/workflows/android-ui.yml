name: Android UI device

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 7 * * *"

# Least privilege for GITHUB_TOKEN: every job reads the repo and nothing
# else unless it asks for more at job level.
permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-device:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # API 36 is the PR gate. The minimum supported API also runs nightly
        # without doubling every contributor's emulator minutes.
        device: ${{ fromJSON(github.event_name == 'schedule' && '["pixel6Api36", "pixel2Api31"]' || '["pixel6Api36"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Android native libraries and bindings
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: bash core/build-android.sh
      - name: Run ${{ matrix.device }} UI tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:${{ matrix.device }}DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace
      - name: Upload device-test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-ui-${{ matrix.device }}
          path: |
            android/app/build/reports/androidTests/managedDevice/
            android/app/build/outputs/managed_device_android_test_additional_output/
          if-no-files-found: ignore
