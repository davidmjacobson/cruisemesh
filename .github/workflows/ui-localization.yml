name: UI localization

on:
  pull_request:
  push:
    branches: [master]

# Least privilege for GITHUB_TOKEN: every job reads the repo and nothing
# else unless it asks for more at job level.
permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check UI localization
        run: python tools/check_ui_localization.py
      - name: Check Android and iOS Terms version parity
        run: python tools/check_terms_version.py
