name: Android release

# Pushing an `android-v*` tag cross-compiles the Rust core for all three device
# ABIs, builds a shrunk release APK (attached to a GitHub Release) and -- when
# the Play publishing secrets are configured -- also builds an upload-key-signed
# AAB and ships it to the Play track named by PLAY_TRACK below via the Play
# Developer API.
#
# Required repository secrets for the Play path:
#   CRUISEMESH_RELEASE_STORE_B64      base64 (no newlines) of app/upload-keystore.jks
#   CRUISEMESH_RELEASE_STORE_PASSWORD keystore store password
#   CRUISEMESH_RELEASE_KEY_ALIAS      key alias (cruisemesh-upload)
#   CRUISEMESH_RELEASE_KEY_PASSWORD   key password
#   PLAY_SERVICE_ACCOUNT_JSON         full JSON of the Play Developer API service account
# The AAB is signed with the upload key; Google Play App Signing re-signs it
# with the app signing key for distribution.
#
# DISTRIBUTING IS NOT OPTIONAL ON A TAG. Pushing the tag *is* the request to
# publish, so a tag run with a publishing secret missing fails immediately and
# names the secret, rather than skipping the upload and reporting success --
# a green release that shipped nothing is the worst outcome this workflow has.
# The build-only mode still exists, but you have to ask for it: run the
# workflow manually from the Actions tab with `distribute: no`, which builds,
# verifies and archives without touching Play or cutting a GitHub Release.
#
# WARNING about the sideload APK: it comes from a separate gradle invocation
# with no signing env, so it falls back to the *debug* keystore -- and a GitHub
# runner has no ~/.android/debug.keystore, so the Android plugin generates a
# fresh one every run. Verified 2026-07-25:
#   * consecutive GitHub-release APKs are signed by DIFFERENT keys, so one can
#     never update the previous in place (INSTALL_FAILED_UPDATE_INCOMPATIBLE).
#     Each install is uninstall-first, losing identity and message history.
#   * that key is not in the site's assetlinks.json, so Android App Links never
#     verify on a sideloaded build and https://cruisemesh.app/r#... opens in
#     the browser instead of the app.
# Testers should install from Play, not from the GitHub release. Fixing this
# means holding a stable sideload keystore as a secret; until then the GitHub
# APK is for one-off manual checks only.

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      distribute:
        description: "Publish to Play and cut a GitHub Release? 'no' = build + verify only."
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # The one switch every publishing step gates on. A tag push is, by
      # definition, a request to distribute; a manual run is a rehearsal unless
      # it explicitly says otherwise. Nothing here reads secret presence: a
      # missing secret must fail the run (see "Assert release mode"), never
      # quietly turn distribution off.
      DISTRIBUTE: ${{ github.event_name == 'push' && 'yes' || inputs.distribute }}
      # Play Developer API track name. `alpha` is what the API calls the
      # console's "Closed testing" -- that is the track the production
      # readiness gate counts (>=12 opted-in testers for 14 continuous days);
      # `internal` does NOT count toward it. Releases used to land on internal
      # because play_publish.py defaults there and this workflow passed no
      # track, which is why the closed track sat holding an unreleased draft.
      # Change to `production` (or add a staged rollout step) after the gate
      # is met.
      PLAY_TRACK: alpha
      # Plain-text record of what this run produced, uploaded as a run artifact
      # at the end. tools/play_publish.py appends the Play identifiers it mints
      # to the same file (it reads this variable itself).
      CRUISEMESH_PROVENANCE_FILE: ${{ github.workspace }}/release-provenance.txt
    steps:
      - uses: actions/checkout@v7

      # --- Release intent ---------------------------------------------------
      # Decide, before anything is built, whether this run publishes. If it
      # does, every credential it will need must already be present: finding
      # out at the upload step is finding out after the release has been
      # announced. If it does not, say so loudly and in the run summary, so a
      # rehearsal can never be mistaken for a shipped release.
      - name: Assert release mode and publishing secrets
        env:
          CRUISEMESH_RELEASE_STORE_B64: ${{ secrets.CRUISEMESH_RELEASE_STORE_B64 }}
          CRUISEMESH_RELEASE_STORE_PASSWORD: ${{ secrets.CRUISEMESH_RELEASE_STORE_PASSWORD }}
          CRUISEMESH_RELEASE_KEY_ALIAS: ${{ secrets.CRUISEMESH_RELEASE_KEY_ALIAS }}
          CRUISEMESH_RELEASE_KEY_PASSWORD: ${{ secrets.CRUISEMESH_RELEASE_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -eo pipefail
          if [ "$DISTRIBUTE" != "yes" ]; then
            echo "::warning title=Build only::This run will NOT publish to Play and will NOT cut a GitHub Release."
            {
              echo "## Build only — nothing was published"
              echo
              echo "This run was started with \`distribute: no\`, so it builds and"
              echo "verifies the artifacts and stops. Push an \`android-v*\` tag to"
              echo "actually release."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ERROR: asked to distribute from '$GITHUB_REF' (ref type '$GITHUB_REF_TYPE')." >&2
            echo "A published build must come from an 'android-v*' tag so the release" >&2
            echo "names one immutable commit. Push a tag, or re-run with distribute: no." >&2
            exit 1
          fi

          missing=""
          for name in \
            CRUISEMESH_RELEASE_STORE_B64 \
            CRUISEMESH_RELEASE_STORE_PASSWORD \
            CRUISEMESH_RELEASE_KEY_ALIAS \
            CRUISEMESH_RELEASE_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON
          do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            {
              echo "ERROR: this run was asked to publish to Google Play, but the"
              echo "repository is missing the secrets it needs:"
              for name in $missing; do
                echo "  - $name"
              done
              echo
              echo "Set them under Settings -> Secrets and variables -> Actions and"
              echo "re-tag. Failing here is deliberate: skipping the upload and"
              echo "reporting success would announce a release that shipped nothing."
            } >&2
            exit 1
          fi
          echo "Publishing enabled: all Play signing and API secrets are present."

      # A tag is only worth anything if it names exactly one commit forever.
      # Fetch it back from the origin and compare: a tag deleted and re-pushed
      # elsewhere, or an old run re-run after the tag moved, fails here.
      - name: Assert the release tag pins this commit
        if: github.ref_type == 'tag'
        run: bash tools/assert_release_tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # core/build-android.sh cross-compiles for these three ABIs via
          # cargo-ndk (arm64-v8a, armeabi-v7a, x86_64 -- see that script's
          # header comment for the authoritative list).
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Maintained action wrapping Google's ndk-bundle installer; sets
      # ANDROID_NDK_HOME/ANDROID_NDK_ROOT for later steps, which is exactly
      # what core/build-android.sh looks for (falls back to scanning
      # $ANDROID_HOME/ndk otherwise).
      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          local-cache: true

      - name: Build core for Android (cross-compile + Kotlin bindings)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash core/build-android.sh

      # versionCode must be unique and strictly increasing for Play/adb to accept
      # an upgrade. Epoch seconds at build time is monotonic for sequential
      # releases AND stays above the epoch-style versionCodes already live on the
      # Play track -- a commit count (the previous scheme, when this workflow only
      # made a GitHub Release and never touched Play) would sit far below them and
      # Play would reject the upload. Fits under the 2100000000 ceiling until
      # ~2036. versionName is the tag with the "android-v" prefix stripped
      # (e.g. tag `android-v1.2.3` -> "1.2.3").
      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version_name="${tag#android-v}"
          else
            # Build-only rehearsal from a branch: there is no release version to
            # claim, so say so rather than stamping a branch name as one.
            version_name="0.0.0-${GITHUB_SHA:0:7}"
          fi
          version_code="$(date +%s)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      # --- Release provenance ---------------------------------------------
      # Records what this run shipped: tag, commit, version, artifact hashes and
      # the store identifiers the publish scripts mint. Purely additive, and
      # every provenance step carries continue-on-error so a release can never
      # fail because a note about it could not be written. Never put
      # continue-on-error on a step that actually gates the release.
      - name: Start provenance record
        continue-on-error: true
        run: |
          {
            echo "# Release"
            echo "workflow: ${{ github.workflow }}"
            echo "tag: ${{ steps.version.outputs.tag }}"
            echo "commit: ${{ github.sha }}"
            echo "version_name: ${{ steps.version.outputs.version_name }}"
            echo "version_code: ${{ steps.version.outputs.version_code }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "recorded_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "## Android release provenance"
            echo
            echo "- **tag**: \`${{ steps.version.outputs.tag }}\`"
            echo "- **commit**: \`${{ github.sha }}\`"
            echo "- **version**: \`${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything below produces something signable/shippable, so this is the
      # last moment where "what we built" and "what the tag says" can still be
      # made to agree. kotlin-gen/, jniLibs/, target/ and the Gradle build dirs
      # are gitignored, so a clean checkout plus core/build-android.sh leaves
      # nothing behind here.
      - name: Assert the working tree matches the commit being released
        run: bash tools/assert_clean_tree.sh

      - name: gradlew assembleRelease (debug-signed APK for sideloading)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.version_code }} \
            -PversionNameOverride=${{ steps.version.outputs.version_name }}

      - name: Verify APK 16 KiB native-library support
        run: python3 tools/check_android_elf_alignment.py android/app/build/outputs/apk/release/app-release.apk

      # The container, not the contents: zipalign + apksigner read the actual
      # zip and signature blocks, so an unaligned or unsigned APK fails here
      # instead of on a tester's phone.
      - name: Assert APK is aligned and signed
        run: bash tools/assert_android_artifact.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK for the release asset
        id: apk
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          dest="cruisemesh-${{ steps.version.outputs.tag }}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Record APK checksum
        continue-on-error: true
        run: |
          path="${{ steps.apk.outputs.path }}"
          sha="$(sha256sum "$path" | awk '{print $1}')"
          bytes="$(wc -c < "$path" | tr -d ' ')"
          {
            echo "# Sideload APK"
            echo "file: $(basename "$path")"
            echo "bytes: $bytes"
            echo "sha256: $sha"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "### Sideload APK"
            echo
            echo "- **file**: \`$(basename "$path")\`"
            echo "- **bytes**: \`$bytes\`"
            echo "- **sha256**: \`$sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release and attach APK
        if: env.DISTRIBUTE == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.path }}" \
            --title "CruiseMesh Android ${{ steps.version.outputs.version_name }}" \
            --notes "Automated build from ${{ github.sha }}. This APK is signed with a throwaway debug key that differs on every run: it cannot update a previous install in place, and app links will not verify against it. Prefer the Play build (upload-key-signed AAB, closed testing)." \
            --generate-notes

      # --- Play publish to PLAY_TRACK (only when secrets are configured) ---

      - name: Decode upload keystore
        if: env.DISTRIBUTE == 'yes'
        env:
          KEYSTORE_B64: ${{ secrets.CRUISEMESH_RELEASE_STORE_B64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: gradlew bundleRelease (upload-key-signed AAB)
        if: env.DISTRIBUTE == 'yes'
        working-directory: android
        env:
          # build.gradle.kts's signingProp() reads these when app/keystore.properties
          # is absent (it is -- gitignored, never in CI). STORE_FILE is resolved
          # relative to android/app/, matching the decode path above.
          CRUISEMESH_RELEASE_STORE_FILE: upload-keystore.jks
          # build.gradle.kts points AGP's ndkPath here so it can extract the
          # native symbol tables debugSymbolLevel packages into the AAB.
          # Without it AGP finds no NDK, logs "Unable to strip", and emits no
          # symbols -- Play then reports the app has native code and none.
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          CRUISEMESH_RELEASE_STORE_PASSWORD: ${{ secrets.CRUISEMESH_RELEASE_STORE_PASSWORD }}
          CRUISEMESH_RELEASE_KEY_ALIAS: ${{ secrets.CRUISEMESH_RELEASE_KEY_ALIAS }}
          CRUISEMESH_RELEASE_KEY_PASSWORD: ${{ secrets.CRUISEMESH_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleRelease \
            -PversionCodeOverride=${{ steps.version.outputs.version_code }} \
            -PversionNameOverride=${{ steps.version.outputs.version_name }}

      - name: Verify AAB 16 KiB native-library support
        if: env.DISTRIBUTE == 'yes'
        run: python3 tools/check_android_elf_alignment.py android/app/build/outputs/bundle/release/app-release.aab

      # A bundle is jar-signed, so apksigner cannot read it; jarsigner is the
      # equivalent proof that the upload key actually signed this file. Play
      # would reject an unsigned bundle too, but only after the workflow had
      # already reported success.
      - name: Assert AAB is signed by the upload key
        if: env.DISTRIBUTE == 'yes'
        run: bash tools/assert_android_artifact.sh android/app/build/outputs/bundle/release/app-release.aab

      # Hash the AAB before the upload, so the record survives a failed publish.
      - name: Record AAB checksum
        if: env.DISTRIBUTE == 'yes'
        continue-on-error: true
        run: |
          path="android/app/build/outputs/bundle/release/app-release.aab"
          sha="$(sha256sum "$path" | awk '{print $1}')"
          bytes="$(wc -c < "$path" | tr -d ' ')"
          {
            echo "# Play AAB"
            echo "file: $(basename "$path")"
            echo "bytes: $bytes"
            echo "sha256: $sha"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "### Play AAB"
            echo
            echo "- **bytes**: \`$bytes\`"
            echo "- **sha256**: \`$sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish AAB to Play (closed testing)
        if: env.DISTRIBUTE == 'yes'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m pip install --quiet --disable-pip-version-check cryptography requests
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-sa.json
          trap 'rm -f play-sa.json' EXIT
          python3 tools/play_publish.py \
            play-sa.json \
            android/app/build/outputs/bundle/release/app-release.aab \
            "${{ steps.version.outputs.version_name }}" \
            "$PLAY_TRACK"

      - name: Clean up decoded keystore
        if: always() && env.DISTRIBUTE == 'yes'
        run: rm -f android/app/upload-keystore.jks

      # The counterpart to the loud failure above: when a run legitimately does
      # not publish, it says so in the log and in the run summary. A skipped
      # upload is a state someone chose, never one nobody noticed.
      - name: Note skipped publish
        if: env.DISTRIBUTE != 'yes'
        run: |
          echo "::notice title=Nothing published::Built and verified only; no Play upload, no GitHub Release."
          {
            echo "### Nothing was published"
            echo
            echo "APK built and verified (aligned, signed, 16 KiB-safe). No AAB was"
            echo "built, nothing was uploaded to Play, and no GitHub Release exists"
            echo "for this run."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # if: always() so the partial record still lands when an earlier step
      # failed -- that is exactly the run whose provenance is worth reading.
      - name: Upload provenance artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-provenance-${{ github.ref_name }}
          path: ${{ github.workspace }}/release-provenance.txt
          if-no-files-found: ignore
          retention-days: 90
