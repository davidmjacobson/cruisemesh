name: iOS

# iOS had no CI. Nothing built the app or ran the XCTest suite on a PR/push,
# so a single bad line -- e.g. an os.Logger String-vs-OSLogMessage break in
# LanTransport (#121) -- failed every iOS build and merged to master
# unnoticed, only caught by hand on the Mac validation host. Android and the
# Rust workspace already gate on every PR (rust.yml); this closes the iOS gap
# using the free macOS runners public repos get.
#
# Path-filtered to iOS- and core-touching changes (a core change regenerates
# the Swift bindings the app links against), plus this workflow itself.

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Tests to run on the macOS host
        required: true
        default: ui
        type: choice
        options:
          - ui
          - all
  pull_request:
    paths:
      - "ios/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/run-ios-ui-tests.ps1"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "ios/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/run-ios-ui-tests.ps1"
      - ".github/workflows/ios.yml"

jobs:
  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'schedule' && '["standard","compact-accessibility","ipad-dark"]' || '["standard"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust stable + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      # Builds the host lib, regenerates the Swift UniFFI bindings under
      # ios/CruiseMesh/Generated, cross-compiles the core for device +
      # simulator archs, and packages the xcframework -- the exact steps the
      # Mac validation runbook uses.
      - name: Build core + Swift bindings + xcframework
        run: bash core/build-ios.sh

      # There is deliberately NO binding drift check here. rust.yml owns the
      # one authoritative, blocking gate for ios/CruiseMesh/Generated: it runs
      # on every PR with no path filter, on a Linux runner, without waiting for
      # Xcode, three cross-compiles and an xcframework -- so it fails far
      # faster than this job could. A second copy here would either duplicate
      # that verdict or, as the `continue-on-error` version it replaces did,
      # sit permanently red and teach everyone to ignore it. (That step
      # compared with plain `git diff`, which trips on the trailing whitespace
      # the committed copies have stripped, so it could never have gone green
      # as written.) The step above still REGENERATES the bindings before
      # compiling, so what this job proves is the complementary half: that a
      # freshly generated binding actually builds and its tests pass.
      #
      # Note what that means for CoreBindingSmokeTests.swift, which this job
      # runs later: because the step above rewrites Generated/ first, the
      # XCTest suite always exercises FRESHLY generated bindings and never the
      # committed ones. Those smokes catch marshalling bugs. They cannot catch
      # committed drift, and must never be cited as a reason to skip
      # regenerating -- rust.yml's diff is the only thing between a stale
      # checked-in binding and a launch-time fatalError on TestFlight.
      #
      # If macOS generation ever diverges from Linux generation, fix it by
      # making rust.yml's gate reproduce the difference -- do not re-add a
      # second gate here. (Both paths now pass --no-format for exactly that
      # reason: uniffi-bindgen runs swiftformat on whichever host happens to
      # have it installed, and only a Mac does.)
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # The cruisemesh:// scheme was declared only in the committed
      # Info.plist, which the step above overwrites from project.yml -- so no
      # CI-built IPA ever registered it, and the website's "Open in CruiseMesh"
      # button was inert in Safari for two releases because nothing checked.
      # Asserts on the GENERATED plist, which is what actually ships.
      - name: Assert generated URL and background-push declarations
        run: |
          set -o pipefail
          plutil -extract CFBundleURLTypes json -o - ios/CruiseMesh/Info.plist \
            | python3 -c "import json,sys; t=json.load(sys.stdin); sys.exit(0) if any('cruisemesh' in d.get('CFBundleURLSchemes', []) for d in t) else sys.exit('Generated Info.plist does not declare the cruisemesh:// URL scheme -- check CFBundleURLTypes in ios/project.yml')"
          plutil -extract UIBackgroundModes json -o - ios/CruiseMesh/Info.plist \
            | python3 -c "import json,sys; m=json.load(sys.stdin); sys.exit(0) if 'remote-notification' in m else sys.exit('Generated Info.plist does not declare remote-notification -- check UIBackgroundModes in ios/project.yml')"
          plutil -extract aps-environment raw -o - ios/CruiseMesh/CruiseMesh.entitlements >/dev/null

      - name: Pick an available simulator for the profile
        id: sim
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,os,sys; d=json.load(sys.stdin)['devices']; p=os.environ['PROFILE']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x.get('isAvailable')]; c=[x for x in c if ('iPad' in x['name'])] if p=='ipad-dark' else [x for x in c if 'iPhone' in x['name']]; compact=[x for x in c if 'SE' in x['name'] or 'mini' in x['name']]; c=compact if p=='compact-accessibility' and compact else c; print(c[0]['udid'])")
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Configure nightly appearance and content size
        if: github.event_name == 'schedule' && matrix.profile != 'standard'
        env:
          PROFILE: ${{ matrix.profile }}
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          if [[ "$PROFILE" == "compact-accessibility" ]]; then
            xcrun simctl ui "$UDID" content_size accessibility-extra-extra-large
          elif [[ "$PROFILE" == "ipad-dark" ]]; then
            xcrun simctl ui "$UDID" appearance dark
          fi

      # -retry-tests-on-failure re-runs only the tests that failed, up to
      # -test-iterations attempts. The XCUITest suite flakes on the shared
      # runner's simulator -- a different test each time, always a
      # waitForExistence timeout -- and one transient miss used to red the whole
      # PR, which teaches everyone to skim past red on the one gate iOS has.
      # This does not weaken it: a genuine break fails both attempts and stays
      # red.
      - name: Build & test on the iOS Simulator
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p build
          ONLY_TESTING=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.suite }}" == "ui" ]]; then
            ONLY_TESTING=(-only-testing:CruiseMeshUITests)
          fi
          xcodebuild test \
            -project CruiseMesh.xcodeproj \
            -scheme CruiseMesh \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 2 \
            "${ONLY_TESTING[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log

      # A retried-and-passed test is a flake the green check would otherwise
      # hide. Say so in the summary, so retries stay visible as a cost rather
      # than becoming the way the suite normally passes.
      - name: Report retried tests
        if: always()
        working-directory: ios
        run: |
          failed=$(grep -cE "Test [Cc]ase .* failed " build/xcodebuild.log || true)
          if [ "${failed:-0}" -gt 0 ]; then
            echo "$failed test attempt(s) failed before the run finished; with retries on, a green check here means a later attempt passed. See the xcodebuild log artifact." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      # The privacy manifest is wired through project.yml, which xcodegen
      # regenerates on every run; the only proof it survived into the app is
      # looking inside the app. Checked here so a PR catches it, and again on
      # the release archive that Apple actually receives.
      - name: Assert the privacy manifest is in the built app
        working-directory: ios
        run: |
          ../tools/assert_privacy_manifest.sh \
            build/dd/Build/Products/Debug-iphonesimulator/CruiseMesh.app

      - name: Upload iOS test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'schedule' && format('ios-test-results-{0}', matrix.profile) || 'ios-test-results' }}
          path: |
            ios/build/TestResults.xcresult
            ios/build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14
