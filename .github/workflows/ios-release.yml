name: iOS release

# Pushing an `ios-v*` tag builds the app on a GitHub macOS runner and -- when the
# signing secrets are configured -- archives it, signs it with a dedicated CI
# distribution certificate + provisioning profile, uploads it to TestFlight, and
# distributes it to the beta group. The iOS mirror of android-release.yml.
#
# Signing is MANUAL: the distribution cert (.p12) and App Store provisioning
# profile are imported from secrets into a throwaway keychain, and
# `xcodebuild -exportArchive` signs entirely locally. This deliberately avoids
# cloud/automatic signing (-allowProvisioningUpdates), whose export-time call to
# Apple's xcbuild provisioning portal intermittently 502/504s and blocked
# releases even when the build was fine. Nothing here touches Apple's portal at
# release time.
#
# Gated on IOS_ENABLED (secrets present) so this is a no-op-safe smoke build in
# forks / before secrets exist. Required secrets:
#   IOS_DIST_CERT_P12_B64      base64 of the distribution .p12
#   IOS_DIST_CERT_PASSWORD     .p12 password
#   IOS_PROVISION_PROFILE_B64  base64 of the App Store .mobileprovision
#   ASC_API_KEY_ID             App Store Connect API key ID (for the upload)
#   ASC_API_ISSUER_ID          App Store Connect API issuer ID
#   ASC_API_KEY_P8             contents of the AuthKey_<id>.p8
# The provisioning profile is named "CruiseMesh CI App Store" and must match the
# provisioningProfiles entry in ios/ExportOptions-AppStoreConnect.plist.
# CFBundleVersion is stamped to epoch seconds (monotonic, above existing
# TestFlight builds); CFBundleShortVersionString comes from the tag.

on:
  push:
    tags:
      - "ios-v*"

jobs:
  release:
    runs-on: macos-latest
    env:
      # Secrets can't be used in step `if:` directly; surface presence as a flag.
      IOS_ENABLED: ${{ secrets.IOS_DIST_CERT_P12_B64 != '' && secrets.ASC_API_KEY_P8 != '' }}
      # Plain-text record of what this run produced, uploaded as a run artifact
      # at the end. tools/testflight_distribute.py appends the App Store Connect
      # identifiers it resolves to the same file (it reads this variable itself).
      CRUISEMESH_PROVENANCE_FILE: ${{ github.workspace }}/release-provenance.txt
    steps:
      - uses: actions/checkout@v7

      # --- Release provenance ---------------------------------------------
      # Records what this run shipped: tag, commit, version, the checksum of the
      # UniFFI Swift bindings that were compiled in, the IPA hash and the App
      # Store Connect identifiers. Purely additive, and every provenance step
      # carries continue-on-error so a release can never fail because a note
      # about it could not be written. Never put continue-on-error on a step
      # that actually gates the release.
      - name: Start provenance record
        continue-on-error: true
        run: |
          {
            echo "# Release"
            echo "workflow: ${{ github.workflow }}"
            echo "tag: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "recorded_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "## iOS release provenance"
            echo
            echo "- **tag**: \`${{ github.ref_name }}\`"
            echo "- **commit**: \`${{ github.sha }}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Android proves its checked-in bindings match the native library it just
      # built (core/build-android.sh stamps both, verifyNativeBindingsSync
      # checks the stamp); iOS has no equivalent gate. Hashing the checked-in
      # Swift bindings here, and again after core/build-ios.sh regenerates them,
      # at least records exactly which bindings shipped -- and says out loud
      # when the committed ones were stale.
      - name: Hash checked-in iOS bindings
        id: bindings
        continue-on-error: true
        run: |
          gen="ios/CruiseMesh/Generated"
          listing="$(cd "$gen" && find . -type f | LC_ALL=C sort | xargs shasum -a 256)"
          combined="$(printf '%s\n' "$listing" | shasum -a 256 | awk '{print $1}')"
          echo "checked_in=$combined" >> "$GITHUB_OUTPUT"
          {
            echo "# iOS bindings (checked in)"
            echo "$listing"
            echo "combined_sha256: $combined"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust stable + iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build core + Swift bindings + xcframework
        run: bash core/build-ios.sh

      - name: Hash rebuilt iOS bindings
        continue-on-error: true
        run: |
          gen="ios/CruiseMesh/Generated"
          listing="$(cd "$gen" && find . -type f | LC_ALL=C sort | xargs shasum -a 256)"
          combined="$(printf '%s\n' "$listing" | shasum -a 256 | awk '{print $1}')"
          checked_in="${{ steps.bindings.outputs.checked_in }}"
          if [ -z "$checked_in" ]; then
            verdict="checked-in bindings hash was not recorded, nothing to compare"
          elif [ "$combined" = "$checked_in" ]; then
            verdict="matches the checked-in bindings"
          else
            verdict="DIFFERS from the checked-in bindings ($checked_in): the committed Swift bindings were stale"
          fi
          {
            echo "# iOS bindings (shipped)"
            echo "$listing"
            echo "combined_sha256: $combined"
            echo "vs_checked_in: $verdict"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "### iOS Swift bindings"
            echo
            echo "- **combined sha256**: \`$combined\`"
            echo "- $verdict"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # xcodegen writes Info.plist from project.yml, so stamp the version AFTER
      # generating. Build number is epoch seconds: monotonic and above the build
      # numbers already on TestFlight. Marketing version is the tag sans "ios-v",
      # reduced to the leading 1-3 integer groups: App Store Connect rejects a
      # CFBundleShortVersionString that isn't 1-3 period-separated integers, so a
      # tag like `ios-v1.2.0-rc1` yields "1.2.0" (the suffix is dropped).
      - name: Stamp version (marketing from tag, build = epoch)
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          raw="${tag#ios-v}"
          marketing="$(printf '%s' "$raw" | grep -oE '^[0-9]+(\.[0-9]+){0,2}' || true)"
          [ -n "$marketing" ] || marketing="0.0.0"
          build="$(date +%s)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $marketing" ios/CruiseMesh/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" ios/CruiseMesh/Info.plist
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Version $marketing ($build)"

      - name: Record version in provenance
        continue-on-error: true
        run: |
          {
            echo "# Version"
            echo "marketing_version: ${{ steps.version.outputs.marketing }}"
            echo "build_number: ${{ steps.version.outputs.build }}"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "- **version**: \`${{ steps.version.outputs.marketing }} (${{ steps.version.outputs.build }})\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Unsigned archive; the distribution signing is applied at export using the
      # imported cert + profile.
      - name: Archive (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CruiseMesh.xcodeproj \
            -scheme CruiseMesh \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CruiseMesh.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # Runs whether or not signing secrets are set, so an unsigned dry run
      # still catches a missing manifest before a real release does.
      - name: Assert the privacy manifest is in the archive
        run: |
          tools/assert_privacy_manifest.sh \
            ios/build/CruiseMesh.xcarchive/Products/Applications/CruiseMesh.app

      - name: Import signing certificate and profile
        if: env.IOS_ENABLED == 'true'
        env:
          IOS_DIST_CERT_P12_B64: ${{ secrets.IOS_DIST_CERT_P12_B64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_B64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ci-signing.keychain-db"
          KC_PW="$(openssl rand -hex 20)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          # Put the CI keychain first, keep login for Apple's WWDR intermediates.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          echo "$IOS_PROVISION_PROFILE_B64" | base64 -d > "$PROFILES/CruiseMesh-CI.mobileprovision"
          echo "Imported signing identity:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        if: env.IOS_ENABLED == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          chmod 700 "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Export (manual-signed) and upload to TestFlight
        if: env.IOS_ENABLED == 'true'
        working-directory: ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/CruiseMesh.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions-AppStoreConnect.plist
          ../tools/assert_privacy_manifest.sh build/export/CruiseMesh.ipa
          xcrun altool --upload-app \
            -f build/export/CruiseMesh.ipa \
            -t ios \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          echo "Uploaded build ${{ steps.version.outputs.build }} (${{ steps.version.outputs.marketing }}) to TestFlight."

      # The uploaded IPA is the thing testers install; hash the exact file that
      # altool sent. Runs even if the upload step failed, so a failed run still
      # says what it built.
      - name: Record IPA checksum
        if: always() && env.IOS_ENABLED == 'true'
        continue-on-error: true
        run: |
          path="ios/build/export/CruiseMesh.ipa"
          [ -f "$path" ] || exit 0
          sha="$(shasum -a 256 "$path" | awk '{print $1}')"
          bytes="$(wc -c < "$path" | tr -d ' ')"
          {
            echo "# IPA"
            echo "file: CruiseMesh.ipa"
            echo "bytes: $bytes"
            echo "sha256: $sha"
            echo
          } >> "$CRUISEMESH_PROVENANCE_FILE"
          {
            echo "### IPA"
            echo
            echo "- **bytes**: \`$bytes\`"
            echo "- **sha256**: \`$sha\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Wait for processing, add to the beta group, submit for beta review.
      # continue-on-error so a slow queue never reds a landed release -- the
      # step writes its own verdict to the run summary instead. That only works
      # because the script's exit code is honest: it exits nonzero on every
      # giving-up path rather than returning 0 with a warning, which is how
      # 1.0.4 reported a distribution that reached nobody.
      #
      # Install into a venv rather than `python3 -m pip install`: the runner's
      # python3 is Homebrew's, and Homebrew marks it externally managed
      # (PEP 668), so a bare pip install now dies with
      # "error: externally-managed-environment" before the script ever runs.
      - name: Distribute to the TestFlight beta group
        if: env.IOS_ENABLED == 'true'
        continue-on-error: true
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPECT_MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
        run: |
          set -o pipefail
          venv="$RUNNER_TEMP/testflight-venv"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --quiet --disable-pip-version-check pyjwt cryptography requests
          if "$venv/bin/python" tools/testflight_distribute.py \
            "$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" \
            "$ASC_API_KEY_ID" \
            "$ASC_API_ISSUER_ID" \
            "${{ steps.version.outputs.build }}"; then
            echo "Distributed build ${{ steps.version.outputs.build }} to the beta group." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**TestFlight distribution FAILED** for build ${{ steps.version.outputs.build }}." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "The build is uploaded but NOT with any tester. Re-run tools/testflight_distribute.py by hand." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Note skipped publish
        if: env.IOS_ENABLED != 'true'
        run: echo "Signing secrets not set — built + archived only; skipped signing/upload."

      - name: Clean up secrets from runner
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/CruiseMesh-CI.mobileprovision" || true

      # if: always() so the partial record still lands when an earlier step
      # failed -- that is exactly the run whose provenance is worth reading.
      - name: Upload provenance artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-provenance-${{ github.ref_name }}
          path: ${{ github.workspace }}/release-provenance.txt
          if-no-files-found: ignore
          retention-days: 90
