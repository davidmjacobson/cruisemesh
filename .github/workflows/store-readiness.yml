name: Store readiness

# Pre-submission check that the public URLs cited in the app store listings
# (landing page, legal pages, support, Cruise Pass, relay health check, and
# the iOS universal-links file) are live and serving the expected content.
# Manually dispatched only — this hits production, not CI infra, and there's
# no reason to run it on every push.
on:
  workflow_dispatch: {}

# Least privilege for GITHUB_TOKEN: every job reads the repo and nothing
# else unless it asks for more at job level.
permissions:
  contents: read

jobs:
  check-public-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: Probe public URLs
        run: node tools/check_public_urls.mjs
