version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # Excluded from the root workspace, so it has its own Cargo.lock that the
  # root entry above never touches: the Tauri messenger host.
  - package-ecosystem: cargo
    directory: /desktop/ui/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The fuzz crate is its own workspace with its own Cargo.lock.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  # The messenger frontend and the Tauri CLI that builds it.
  - package-ecosystem: npm
    directory: /desktop/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # AGP majors are deliberate upgrades; the 8.x line is pinned (see #456).
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major"]
      # Pinned to alpha15, see #457.
      - dependency-name: com.android.tools.screenshot:screenshot-validation-api
      # Deliberate upgrade pending.
      - dependency-name: androidx.compose:compose-bom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
