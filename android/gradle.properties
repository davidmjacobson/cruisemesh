org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Host-side Compose golden tests. References live in
# app/src/screenshotTestDebug/reference (the screenshot plugin's own layout since
# alpha10; it read app/src/debug/screenshotTest/reference before that) and are
# validated in CI.
android.experimental.enableScreenshotTest=true
