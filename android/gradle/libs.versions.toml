[versions]
agp = "8.9.3"
kotlin = "2.0.21"
composeBom = "2024.10.01"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.6"
lifecycleRuntimeCompose = "2.8.6"
activityCompose = "1.9.2"
navigationCompose = "2.8.2"
zxingCore = "3.5.4"
jna = "5.18.1"
junit = "4.13.2"
camerax = "1.5.1"
okhttp = "4.12.0"
gson = "2.14.0"
exifinterface = "1.4.2"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
androidxTestOrchestrator = "1.6.1"
robolectric = "4.16.1"
# alpha10+ renders ONLY previews annotated @PreviewTest; alpha09 rendered every
# @Preview. Every preview in src/screenshotTest carries it, and if one ever
# stops, validateDebugScreenshotTest quietly renders fewer previews while still
# reporting success -- which is why app/build.gradle.kts asserts the collected
# count against the previews on disk (verifyScreenshotPreviewsCollected).
screenshot = "0.0.1-alpha16"
# @PreviewTest itself, and deliberately NOT version.ref'd to the plugin above.
# The annotation ships in a separate artifact whose alpha16 release is compiled
# with Kotlin 2.2 metadata, which the 2.0.21 compiler above refuses to read
# ("binary version of its metadata is 2.2.0, expected version is 2.0.0"), so
# compiling against it is a hard error until Kotlin moves. alpha15 is the last
# release built with 1.9-compatible metadata; its PreviewTest is the same
# no-member marker as alpha16's (RUNTIME retention, METHOD target,
# @Testable-annotated), it is compileOnly, and the plugin's own engine puts its
# matching alpha16 copy on the test runtime classpath. Bump this to match the
# plugin once the project's Kotlin is 2.2+.
screenshotValidationApi = "0.0.1-alpha16"

[libraries]
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxingCore" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camerax-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTest" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "androidxTestOrchestrator" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Supplies the @PreviewTest annotation. The screenshot plugin puts its JUnit
# engine (and this artifact, transitively) on the test runtime classpath itself,
# but nothing on the compile classpath, so a preview cannot be marked
# collectable without declaring it here.
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshotValidationApi" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
