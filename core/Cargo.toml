[package]
name = "cruisemesh-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
name = "cruisemesh_core"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]

# The replay/validate command from the field-evidence work. No extra
# dependencies: it reads the same JSONL the core library already parses, so
# `cargo run -p cruisemesh-core --bin protocol-replay -- <file>` works in a
# clean checkout with nothing installed.
[[bin]]
name = "protocol-replay"
path = "src/bin/protocol_replay.rs"

[dependencies]
uniffi = { version = "0.32" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }
blake2 = "0.10"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
crypto_box = "0.9"
chacha20poly1305 = "0.10"
snow = "0.10"
sha2 = "0.10"
aes-gcm = "0.10"
pbkdf2 = "0.12"

[build-dependencies]
uniffi = { version = "0.32", features = ["build"] }

[dev-dependencies]
uniffi = { version = "0.32", features = ["bindgen-tests"] }

[features]
cli = ["uniffi/cli"]
